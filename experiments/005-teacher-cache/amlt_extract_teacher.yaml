description: "110K Teacher Cache 提取 - 6 job 并行 (每 job 4×A100, prefetch=0, shard_prefix 避免冲突)"

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws

environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow

code:
  local_dir: $CONFIG_DIR

jobs:
  - name: extract-110k-p0
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        torchrun --nproc_per_node=4 extract_teacher.py
        --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_train.jsonl
        --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1
        --output_dir /mnt/default/bottleneck/teacher_cache_110k_v2
        --model_path Qwen/Qwen2.5-VL-7B-Instruct
        --start_idx 0 --end_idx 18338
        --shard_size 512 --shard_prefix p0
        --fps 1.0 --frames_per_segment 2 --max_frames 30
        --prefetch_workers 0
        2>&1 | tee $$AMLT_OUTPUT_DIR/extract_log.txt

  - name: extract-110k-p1
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        torchrun --nproc_per_node=4 --master_port=29501 extract_teacher.py
        --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_train.jsonl
        --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1
        --output_dir /mnt/default/bottleneck/teacher_cache_110k_v2
        --model_path Qwen/Qwen2.5-VL-7B-Instruct
        --start_idx 18338 --end_idx 36676
        --shard_size 512 --shard_prefix p1
        --fps 1.0 --frames_per_segment 2 --max_frames 30
        --prefetch_workers 0
        2>&1 | tee $$AMLT_OUTPUT_DIR/extract_log.txt

  - name: extract-110k-p2
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        torchrun --nproc_per_node=4 --master_port=29502 extract_teacher.py
        --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_train.jsonl
        --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1
        --output_dir /mnt/default/bottleneck/teacher_cache_110k_v2
