        CUDA_VISIBLE_DEVICES=2 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K4_B2L_ep1.pt --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=3 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K4_B2L_ep1.pt --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
        wait

  - name: mvb-k8-ep1
    sku: 80G4-A100
    sla_tier: basic
    command:
      - >-
        CUDA_VISIBLE_DEVICES=0 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K8_B2L_ep1.pt --shard_id 0 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard0.json > $$AMLT_OUTPUT_DIR/shard0.txt 2>&1 &
