description: "MVBench 009+010 全量 sdpa BSC (重跑)"
target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws
environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install --no-cache-dir transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow
code:
  local_dir: $CONFIG_DIR
jobs:
  - name: mvb-009-ep1
    sku: 80G4-A100-NvLink
    sla_tier: basic
    command:
      - >-
        CUDA_VISIBLE_DEVICES=0 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --shard_id 0 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard0.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard0.txt &
        CUDA_VISIBLE_DEVICES=1 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --shard_id 1 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard1.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard1.txt &
        CUDA_VISIBLE_DEVICES=2 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard2.txt &
        CUDA_VISIBLE_DEVICES=3 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard3.txt &
        wait
  - name: mvb-010-ep1
    sku: 80G4-A100-NvLink
    sla_tier: basic
    command:
      - >-
        CUDA_VISIBLE_DEVICES=0 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --shard_id 0 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard0.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard0.txt &
        CUDA_VISIBLE_DEVICES=1 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --shard_id 1 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard1.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard1.txt &
        CUDA_VISIBLE_DEVICES=2 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard2.txt &
        CUDA_VISIBLE_DEVICES=3 python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json 2>&1 | tee $$AMLT_OUTPUT_DIR/shard3.txt &
        wait
