description: "串行 test: 新代码 sdpa 全组合 5-10 题"
target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws
environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install --no-cache-dir transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow pandas pyarrow
code:
  local_dir: $CONFIG_DIR
jobs:
  - name: serial-test-all
    sku: 80G4-A100
    sla_tier: basic
    command:
      - >-
        set -e &&
        echo "=== MVBench 006 ===" &&
        python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt --num_shards 200 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/mvb_006.txt &&
        echo "=== MVBench 007 ===" &&
        python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/007_interseg/110k_interseg_B1L_ep1.pt --num_shards 200 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/mvb_007.txt &&
        echo "=== MVBench K8 ===" &&
        python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K8_B2L_ep1.pt --num_shards 200 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/mvb_k8.txt &&
        echo "=== MVBench 009 ===" &&
        python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --num_shards 200 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/mvb_009.txt &&
        echo "=== MVBench 010 ===" &&
        python eval_mvbench.py --video_base /mnt/default/bottleneck/benchmarks/mvbench/videos --json_base /mnt/default/bottleneck/benchmarks/mvbench/json --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --num_shards 200 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/mvb_010.txt &&
        echo "=== VME 009 ===" &&
        python eval_videomme_short.py --video_dir /mnt/default/bottleneck/benchmarks/videomme/videos --parquet_path /mnt/default/bottleneck/benchmarks/videomme/test.parquet --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --num_shards 90 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/vme_009.txt &&
        echo "=== VME 010 ===" &&
        python eval_videomme_short.py --video_dir /mnt/default/bottleneck/benchmarks/videomme/videos --parquet_path /mnt/default/bottleneck/benchmarks/videomme/test.parquet --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --num_shards 90 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/vme_010.txt &&
        echo "=== NQA 006 ===" &&
        python eval_nextqa.py --video_dir /mnt/default/bottleneck/benchmarks/nextqa/videos --csv_path /mnt/default/bottleneck/benchmarks/nextqa/test.csv --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt --num_shards 856 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/nqa_006.txt &&
        echo "=== NQA 009 ===" &&
        python eval_nextqa.py --video_dir /mnt/default/bottleneck/benchmarks/nextqa/videos --csv_path /mnt/default/bottleneck/benchmarks/nextqa/test.csv --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/009_pooling/110k_pool_B1L_ep1.pt --num_shards 856 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/nqa_009.txt &&
        echo "=== NQA 010 ===" &&
        python eval_nextqa.py --video_dir /mnt/default/bottleneck/benchmarks/nextqa/videos --csv_path /mnt/default/bottleneck/benchmarks/nextqa/test.csv --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/010_gated/110k_gated_B2L_ep1.pt --num_shards 856 --shard_id 0 2>&1 | tee $$AMLT_OUTPUT_DIR/nqa_010.txt &&
        echo "=== ALL DONE ==="
