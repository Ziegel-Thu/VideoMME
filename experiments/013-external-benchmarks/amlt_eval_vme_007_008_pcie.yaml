        CUDA_VISIBLE_DEVICES=2 python eval_videomme_short.py --video_dir /mnt/default/bottleneck/benchmarks/videomme/videos --parquet_path /mnt/default/bottleneck/benchmarks/videomme/test.parquet --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K4_B2L_ep1.pt --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=3 python eval_videomme_short.py --video_dir /mnt/default/bottleneck/benchmarks/videomme/videos --parquet_path /mnt/default/bottleneck/benchmarks/videomme/test.parquet --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --checkpoint /mnt/default/bottleneck/checkpoints/008_ksweep/110k_K4_B2L_ep1.pt --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
