description: "011 Temporal Head 方案 B (segment) 全量训练"

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws

environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow

code:
  local_dir: $CONFIG_DIR

storage:
  bottleneck:
    storage_account_name: shuwangmain
    container_name: amulet
    mount_dir: /mnt/default
    is_output: true

jobs:
  - name: temporal-b-full
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        python train_temporal.py
        --compressor_checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt
        --data_path /mnt/default/bottleneck/data/parsed/temporal_evidence.jsonl
        --video_dirs /mnt/default/bottleneck/data/stgr_videos/temporal_grounding/videos,/mnt/default/bottleneck/data/stgr_videos/plm/videos
        --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct
        --head_type B --num_bins 16 --num_frames 16 --frames_per_segment 2
        --lr 1e-4 --epochs 10
        --output_dir $$AMLT_OUTPUT_DIR
        2>&1 | tee $$AMLT_OUTPUT_DIR/train_log.txt
