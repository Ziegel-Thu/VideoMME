description: "014 LiteFrame CTD 10k steps (ViT-Base student, 4-frame 448x448)"

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws

environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow

code:
  local_dir: $CONFIG_DIR

jobs:
  - name: ctd-10k
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        torchrun --nproc_per_node=4 train_ctd.py
        --video_dir /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1
        --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct
        --num_frames 4 --batch_size 2
        --steps 10000 --lr 4e-5 --warmup_ratio 0.05
        --save_steps 2000 --log_interval 50
        --output_dir $$AMLT_OUTPUT_DIR
        --num_workers 4
        2>&1 | tee $$AMLT_OUTPUT_DIR/train_log.txt
