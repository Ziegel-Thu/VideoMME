        CUDA_VISIBLE_DEVICES=1 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 1 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard1.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=2 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 2 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=3 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 3 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
