description: "006 B-1L/B-2L 内部 MCQ full eval (blob checkpoint, 4卡并行)"

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws

environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow

code:
  local_dir: $CONFIG_DIR

jobs:
  - name: eval-b1l-ep1-030
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        CUDA_VISIBLE_DEVICES=0 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 0 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard0.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=1 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 1 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard1.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=2 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 2 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=3 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B1L_ep1.pt --max_samples 0 --shard_id 3 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
        wait

  - name: eval-b2l-ep2-030
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - >-
        CUDA_VISIBLE_DEVICES=0 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt --max_samples 0 --shard_id 0 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard0.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=1 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt --max_samples 0 --shard_id 1 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard1.txt 2>&1 &
        CUDA_VISIBLE_DEVICES=2 python eval_compressor.py --model_path /mnt/default/bottleneck/models/Qwen2.5-VL-7B-Instruct --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --checkpoint /mnt/default/bottleneck/checkpoints/006_compressor/110k_B2L_ep2.pt --max_samples 0 --shard_id 2 --num_shards 4 > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
