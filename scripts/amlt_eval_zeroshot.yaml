description: "Zero-shot baseline eval: 0-30 + 0-60 全量 (单 job 4卡并行分片)"

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msraairwsws

environment:
  image: amlt-sing/2.5.0-cuda12.4-cudnn9-devel
  setup:
    - pip install transformers==4.57.6 peft accelerate qwen-vl-utils decord pillow

code:
  local_dir: $CONFIG_DIR

jobs:
  - name: zeroshot-0-30-full-4gpu
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - CUDA_VISIBLE_DEVICES=0 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 0 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard0.json > $$AMLT_OUTPUT_DIR/shard0.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=1 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 1 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard1.json > $$AMLT_OUTPUT_DIR/shard1.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=2 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=3 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
      - wait

  - name: zeroshot-0-60-full-4gpu
    sku: 80G4-A100-NvLink
    sla_tier: standard
    command:
      - CUDA_VISIBLE_DEVICES=0 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 0 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard0.json > $$AMLT_OUTPUT_DIR/shard0.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=1 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 1 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard1.json > $$AMLT_OUTPUT_DIR/shard1.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=2 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 2 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard2.json > $$AMLT_OUTPUT_DIR/shard2.txt 2>&1 &
      - CUDA_VISIBLE_DEVICES=3 python eval_mcq.py --data_path /mnt/default/bottleneck/data/parsed/visual_qa_v3_60s_test.jsonl --video_dirs /mnt/default/bottleneck/data/videos/0_30_s_academic_v0_1,/mnt/default/bottleneck/data/videos/30_60_s_academic_v0_1 --model_path Qwen/Qwen2.5-VL-7B-Instruct --max_samples 0 --logit_only --shard_id 3 --num_shards 4 --output $$AMLT_OUTPUT_DIR/shard3.json > $$AMLT_OUTPUT_DIR/shard3.txt 2>&1 &
      - wait
